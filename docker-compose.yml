# docker compose up                                           -> Streamlit on http://localhost:8501 (the only service that starts by default)
# docker compose --profile cli run --rm cli                    -> offline stub, one-shot CLI run
# docker compose --profile cli run --rm cli --llm groq --reset-memory    -> needs GROQ_API_KEY in .env
# docker compose --profile cli run --rm cli --llm gemini --reset-memory  -> needs GEMINI_API_KEY in .env
services:
  cli:
    profiles: ["cli"]
    build: .
    env_file:
      - path: .env
        required: false
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
  ui:
    build: .
    entrypoint: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    env_file:
      - path: .env
        required: false
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
